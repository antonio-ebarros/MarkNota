<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- MarkNota — "M" azul #2563EB sobre vidro branco fosco -->
  <defs>
    <!-- Vidro branco translúcido (mais opaco no topo, mais fosco embaixo) -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="55%" stop-color="#f4f7fc" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#e6ecf6" stop-opacity="0.78" />
    </linearGradient>
    <!-- Borda: brilho branco em cima, leve contorno frio embaixo -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.45" />
    </linearGradient>
    <!-- Reflexo suave no topo -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <!-- Sombra projetada -->
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <!-- Leve variação no azul do M -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Sombra -->
  <ellipse cx="256" cy="470" rx="200" ry="26" fill="url(#shadow)" />

  <!-- Placa de vidro -->
  <rect x="32" y="28" width="448" height="448" rx="104" ry="104"
        fill="url(#glass)" stroke="url(#rim)" stroke-width="6" />

  <!-- Reflexo -->
  <path d="M136 40 H376 A92 92 0 0 1 468 132 V170 Q256 210 44 170 V132 A92 92 0 0 1 136 40 Z"
        fill="url(#sheen)" opacity="0.45" />

  <!-- Letra M (vetorial, independe de fonte instalada) -->
  <path d="M164 352 V166 L256 284 L348 166 V352"
        fill="none" stroke="url(#ink)" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
