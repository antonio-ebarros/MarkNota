<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="m-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>

  <!-- Quadrado arredondado -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="96"
    ry="96"
    fill="url(#bg-grad)"
    stroke="url(#border-grad)"
    stroke-width="10"
  />

  <!-- Brilho sutil superior -->
  <rect
    x="36"
    y="36"
    width="440"
    height="210"
    rx="84"
    ry="84"
    fill="#ffffff"
    fill-opacity="0.04"
  />

  <!-- Letra M centralizada em fonte monoespaçada -->
  <text
    x="256"
    y="354"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Fira Code', 'Noto Sans Mono', 'DejaVu Sans Mono', monospace"
    font-size="300"
    font-weight="700"
    fill="url(#m-grad)"
  >M</text>
</svg>
